spring.application.name=api-gateway
server.port=8090
#Rutas del microservicio de cuentas
spring.cloud.gateway.server.webflux.routes[0].id=ms-cuentas
spring.cloud.gateway.server.webflux.routes[0].uri=lb://localhost:8091
spring.cloud.gateway.server.webflux.routes[0].predicates[0]=Path=/api/v1/cuentas/**
#Rutas del microservicio de catalogos
spring.cloud.gateway.server.webflux.routes[1].id=ms-catalogos
spring.cloud.gateway.server.webflux.routes[1].uri=lb://localhost:8092
spring.cloud.gateway.server.webflux.routes[1].predicates[0]=Path=/api/v1/catalogos/**
#Rutas del microservicio de prestamos
spring.cloud.gateway.server.webflux.routes[2].id=ms-prestamos
spring.cloud.gateway.server.webflux.routes[2].uri=lb://localhost:8093
spring.cloud.gateway.server.webflux.routes[2].predicates[0]=Path=/api/v1/prestamos/**
#Rutas del microservicio de tarjetas
spring.cloud.gateway.server.webflux.routes[3].id=ms-tarjetas
spring.cloud.gateway.server.webflux.routes[3].uri=lb://localhost:8094
spring.cloud.gateway.server.webflux.routes[3].predicates[0]=Path=/api/v1/tarjetas/**
#Rutas del microservicio de transacciones
spring.cloud.gateway.server.webflux.routes[4].id=ms-transacciones
spring.cloud.gateway.server.webflux.routes[4].uri=lb://localhost:8095
spring.cloud.gateway.server.webflux.routes[4].predicates[0]=Path=/api/v1/transacciones/**

#Configuración de Eureka Client
eureka.client.serviceurl.defaultZone=http://localhost:8085/eureka
eureka.instance.instance-id =${spring.application.name}:${spring.application.instance_id:${random.value}}
